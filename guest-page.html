<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Test call</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#13202b;--muted:#5b6a77;--line:#dce2e8;--accent:#0b7a75;--accent-ink:#fff;--danger:#b42318;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e151b;--card:#16202a;--ink:#e6edf3;--muted:#93a2af;--line:#26333e;--accent:#2bb3ab;--accent-ink:#04201e;--danger:#f97066}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}
[hidden]{display:none!important}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;width:100%;max-width:420px;display:grid;gap:12px}
h1{margin:0;font-size:22px}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.who{font-size:20px;font-weight:700}
#status{font-weight:600;min-height:1.5em}
#status.bad{color:var(--danger)}
#timer{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
input{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 20px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:17px}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
</style>
</head>
<body>
<main class="box">
  <h1>Test call</h1>
  <p class="who" id="who">Loading…</p>
  <p class="muted">This is a quick test of a phone system. The call uses your browser's microphone. This page does not record or save anything.</p>
  <label id="numWrap" hidden class="muted">UK number to call
    <input type="tel" id="num" placeholder="07123 456789" autocomplete="off" inputmode="tel">
  </label>
  <p id="status" role="status" aria-live="polite">Preparing…</p>
  <p id="timer" hidden>00:00</p>
  <div class="row">
    <button class="primary" id="callBtn" disabled>Start test call</button>
    <button class="danger" id="hangBtn" hidden>Hang up</button>
    <button id="muteBtn" hidden aria-pressed="false">Mute</button>
  </div>
  <p class="muted" id="exp"></p>
</main>

<script src="/vendor/twilio.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const link = decodeURIComponent(location.pathname.split('/')[2] || '');
let device = null, call = null, info = null, startedAt = null, tick = null, ended = true;

function say(msg, bad) { const s = $('#status'); s.textContent = msg; s.className = bad ? 'bad' : ''; }
function over(msg) { $('#callBtn').disabled = true; $('#callBtn').hidden = false; say(msg, true); }

async function getInfo() {
  const r = await fetch('/api/guest/' + encodeURIComponent(link) + '/info', { cache: 'no-store' });
  if (!r.ok) throw new Error('expired');
  return r.json();
}

async function init() {
  try { info = await getInfo(); } catch (e) { $('#who').textContent = ''; over('This link has expired or is not valid.'); return; }
  $('#who').textContent = info.needsNumber ? 'Enter the UK number you want to call' : 'You will call ' + info.masked;
  $('#numWrap').hidden = !info.needsNumber;
  drawExpiry();
  setInterval(drawExpiry, 1000);
  if (info.callsLeft < 1) { over('No test calls left on this link.'); return; }
  say('Ready. Allow the microphone when your browser asks.');
  $('#callBtn').disabled = false;
}

function drawExpiry() {
  if (!info) return;
  const s = Math.max(0, Math.floor((info.expiresAt - Date.now()) / 1000));
  $('#exp').textContent = s > 0 ? 'This link expires in ' + Math.ceil(s / 60) + ' min.' : '';
  if (s === 0 && ended) over('This link has expired.');
}

async function micOk() {
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    st.getTracks().forEach((t) => t.stop());
    return true;
  } catch (e) {
    say('The microphone is blocked. Allow it in your browser settings for this page, then reload.', true);
    return false;
  }
}

function friendly(e) {
  const c = e && e.code;
  if (c === 31402 || c === 31208) return 'The microphone is blocked. Allow it for this page and try again.';
  if (c === 31005 || c === 31009) return 'The call could not connect. Tell the person who sent you this link.';
  if (c === 20101 || c === 20104 || c === 31204) return 'This link has expired.';
  return (e && e.message) || 'Something went wrong. Tell the person who sent you this link.';
}

async function start() {
  if (!ended) return;
  const typed = $('#num').value.trim();
  if (info && info.needsNumber && !/^(\+?44|0)\s?[\d\s()-]{9,14}$/.test(typed)) { say('Enter a UK number, like 07123 456789.', true); return; }
  $('#callBtn').disabled = true;
  if (!(await micOk())) { $('#callBtn').disabled = false; return; }
  try {
    say('Connecting…');
    const r = await fetch('/api/guest/' + encodeURIComponent(link) + '/token', { cache: 'no-store' });
    if (!r.ok) { over((await r.json().catch(() => ({}))).error || 'This link has expired.'); return; }
    const { token } = await r.json();
    if (device) device.destroy();
    device = new Twilio.Device(token, { logLevel: 1, codecPreferences: ['opus', 'pcmu'] });
    device.on('error', (e) => { say(friendly(e), true); finish(); });
    ended = false;
    call = await device.connect({ params: info.needsNumber ? { GuestToken: link, To: typed } : { GuestToken: link } });
    $('#num').disabled = true;
    $('#callBtn').hidden = true; $('#hangBtn').hidden = false; $('#muteBtn').hidden = false;
    call.on('ringing', () => say('Ringing…'));
    call.on('accept', () => { startedAt = Date.now(); say('Connected. Say hello.'); $('#timer').hidden = false; tick = setInterval(drawTimer, 500); drawTimer(); });
    ['disconnect', 'cancel', 'reject'].forEach((ev) => call.on(ev, () => finish('Call ended.')));
    call.on('error', (e) => { say(friendly(e), true); finish(); });
  } catch (e) {
    say(friendly(e), true); finish();
  }
}

function drawTimer() { if (!startedAt) return; const s = Math.floor((Date.now() - startedAt) / 1000); $('#timer').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }

async function finish(msg) {
  clearInterval(tick); startedAt = null; ended = true; call = null;
  $('#hangBtn').hidden = true; $('#muteBtn').hidden = true; $('#callBtn').hidden = false; $('#num').disabled = false;
  $('#muteBtn').setAttribute('aria-pressed', 'false'); $('#muteBtn').textContent = 'Mute';
  if (msg) say(msg);
  try {
    info = await getInfo();
    if (info.callsLeft < 1) { over('Thank you, the test is finished.'); return; }
    $('#callBtn').disabled = false; $('#callBtn').textContent = 'Call again';
  } catch (e) { over('This link has expired.'); }
}

$('#callBtn').addEventListener('click', start);
$('#hangBtn').addEventListener('click', () => { if (call) call.disconnect(); });
$('#muteBtn').addEventListener('click', () => {
  if (!call) return; const m = !call.isMuted(); call.mute(m);
  $('#muteBtn').setAttribute('aria-pressed', String(m)); $('#muteBtn').textContent = m ? 'Unmute' : 'Mute';
});
init();
</script>
</body>
</html>
